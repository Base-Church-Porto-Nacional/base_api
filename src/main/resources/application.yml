spring:
  application:
    name: base_api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:igreja_db}
    username: ${DB_USER:gustavoantunes}
    password: ${DB_PASSWORD:igreja}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    virtual-host: ${RABBIT_VHOST:/}

server:
  port: ${SERVER_PORT:8080}
  # Atrás de proxy reverso (nginx, load balancer) o IP real vem de X-Forwarded-For,
  # tratado pelo container. Sem proxy, use NONE para o header não ser aceito do cliente.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:NATIVE}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    # Só verifica o broker quando a fila está habilitada; sem isso o health fica DOWN sem RabbitMQ.
    rabbit:
      enabled: ${RABBIT_HABILITADO:false}

app:
  # Primeiro administrador (só é criado quando não há nenhum usuário; ignorado no perfil dev).
  bootstrap:
    admin:
      username: ${ADMIN_USERNAME:}
      email: ${ADMIN_EMAIL:}
      senha: ${ADMIN_SENHA:}
      nome: ${ADMIN_NOME:}
  # Fuso usado pelos agendamentos (aniversário às 12h, automação de cultos/escalas no dia 20).
  timezone: ${APP_TIMEZONE:America/Sao_Paulo}
  jwt:
    secret: ${JWT_SECRET:change-me-use-a-long-secure-secret-key-at-least-256-bits}
    expiration-ms: ${JWT_EXPIRATION_MS:14400000}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  aniversario:
    ativo: ${MESSAGE_ANIVERSARIO_ATIVO:true}
    cron: ${MESSAGE_ANIVERSARIO_CRON:0 0 12 * * *}
    template: ${MESSAGE_ANIVERSARIO_TEMPLATE:Feliz aniversário, {primeiroNome}! Que Deus abençoe a sua vida e lhe conceda um dia cheio de paz, alegria e gratidão. Com carinho, {igreja}.}
  whatsapp:
    habilitado: ${WHATSAPP_HABILITADO:false}
    url-base: ${WHATSAPP_URL_BASE:}
    api-key: ${WHATSAPP_API_KEY:}
    instancia: ${WHATSAPP_INSTANCIA:}
    delay-ms: ${WHATSAPP_DELAY_MS:1200}
    link-preview: ${WHATSAPP_LINK_PREVIEW:true}

  rabbit:
    # false = envio síncrono direto ao canal (sem broker);
    # true = publica na fila e o consumidor entrega e grava o status final.
    habilitado: ${RABBIT_HABILITADO:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
